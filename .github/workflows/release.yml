name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # Build release artifacts for every platform
  # ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: heap-oracle
            hook_lib: libheap_oracle_hook.so
            archive_ext: tar.gz

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: heap-oracle
            hook_lib: libheap_oracle_hook.dylib
            archive_ext: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: heap-oracle
            hook_lib: libheap_oracle_hook.dylib
            archive_ext: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: heap-oracle.exe
            hook_lib: heap_oracle_hook.dll
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      # ── Package ─────────────────────────────────
      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGING="heap-oracle-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$STAGING/"
          cp "target/release/${{ matrix.hook_lib }}" "$STAGING/" 2>/dev/null \
            || cp "target/${{ matrix.target }}/release/${{ matrix.hook_lib }}" "$STAGING/" 2>/dev/null \
            || true
          tar -czf "${STAGING}.tar.gz" "$STAGING"
          echo "ASSET=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "heap-oracle-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.artifact_name }}" $staging\
          $hookSrc = "target\release\${{ matrix.hook_lib }}"
          if (Test-Path $hookSrc) {
            Copy-Item $hookSrc $staging\
          } else {
            $alt = "target\${{ matrix.target }}\release\${{ matrix.hook_lib }}"
            if (Test-Path $alt) { Copy-Item $alt $staging\ }
          }
          Compress-Archive -Path "$staging\*" -DestinationPath "$staging.zip"
          Add-Content $env:GITHUB_ENV "ASSET=$staging.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Create GitHub Release and attach all artifacts
  # ──────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Generate changelog since last tag
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Heap Oracle ${{ github.ref_name }}"
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Downloads
            | Platform | Archive |
            |---|---|
            | Linux x86_64 | `heap-oracle-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz` |
            | macOS x86_64 | `heap-oracle-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz` |
            | macOS arm64  | `heap-oracle-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz` |
            | Windows x64  | `heap-oracle-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip` |

            Each archive contains the `heap-oracle` binary **and** the hook shared library (`libheap_oracle_hook.so` / `.dylib` / `.dll`).
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/**/*